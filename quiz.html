<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #16213e;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #e94560;
    }
    .score-area {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }
    .timer-bar-bg {
      background: #0f3460;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #f5a623);
      border-radius: 10px;
      transition: width 0.1s linear;
    }
    .question {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
      min-height: 60px;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .option {
      background: #0f3460;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option:hover { border-color: #e94560; transform: translateY(-2px); }
    .option.correct { background: #1a6b3c; border-color: #2ecc71; }
    .option.wrong { background: #6b1a1a; border-color: #e94560; }
    .option.disabled { cursor: default; pointer-events: none; }
    .result {
      text-align: center;
      display: none;
    }
    .result h2 { font-size: 2rem; margin-bottom: 10px; }
    .result .final-score { font-size: 3rem; color: #e94560; font-weight: bold; margin: 20px 0; }
    .result p { color: #aaa; margin-bottom: 30px; }
    .btn {
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .feedback {
      text-align: center;
      font-size: 0.95rem;
      min-height: 24px;
      margin-top: 20px;
      color: #f5a623;
    }
    @media (max-width: 480px) {
      .options { grid-template-columns: 1fr; }
      .container { padding: 24px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="game-area">
    <h1>🧠 クイズゲーム</h1>
    <div class="score-area">
      問題 <span id="q-num">1</span> / <span id="q-total">5</span>　｜　スコア: <span id="score">0</span>
    </div>
    <div class="timer-bar-bg">
      <div class="timer-bar" id="timer-bar"></div>
    </div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result" id="result-area">
    <h2>🎉 ゲーム終了！</h2>
    <div class="final-score" id="final-score"></div>
    <p id="result-comment"></p>
    <button class="btn" onclick="startGame()">もう一度挑戦</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "日本で一番高い山は？",
    options: ["富士山", "北岳", "槍ヶ岳", "白山"],
    answer: 0
  },
  {
    q: "水の化学式は？",
    options: ["CO2", "H2O", "O2", "NaCl"],
    answer: 1
  },
  {
    q: "世界で最も大きい国（面積）は？",
    options: ["中国", "カナダ", "アメリカ", "ロシア"],
    answer: 3
  },
  {
    q: "1 + 1 = ？（難問）",
    options: ["1", "2", "3", "窓"],
    answer: 1
  },
  {
    q: "「バイブコーディング」とは何？",
    options: [
      "音楽を聴きながらコードを書く",
      "AIと対話しながらアプリを作る手法",
      "バイブレーションでコードを入力する",
      "コードを書かずにサボること"
    ],
    answer: 1
  }
];

let current = 0;
let score = 0;
let timer = null;
let timeLeft = 0;
const TIME_LIMIT = 15;

function startGame() {
  current = 0;
  score = 0;
  document.getElementById('game-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('q-num').textContent = current + 1;
  document.getElementById('q-total').textContent = questions.length;
  document.getElementById('score').textContent = score;
  document.getElementById('question').textContent = q.q;
  document.getElementById('feedback').textContent = '';

  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optEl.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = TIME_LIMIT;
  updateTimerBar();
  timer = setInterval(() => {
    timeLeft -= 0.1;
    updateTimerBar();
    if (timeLeft <= 0) {
      clearInterval(timer);
      timeUp();
    }
  }, 100);
}

function updateTimerBar() {
  document.getElementById('timer-bar').style.width = (timeLeft / TIME_LIMIT * 100) + '%';
}

function timeUp() {
  const q = questions[current];
  document.getElementById('feedback').textContent = '⏰ 時間切れ！正解は「' + q.options[q.answer] + '」でした';
  highlightAnswer(q.answer, -1);
  setTimeout(nextQuestion, 1800);
}

function selectAnswer(idx) {
  clearInterval(timer);
  const q = questions[current];
  if (idx === q.answer) {
    score++;
    document.getElementById('feedback').textContent = '✅ 正解！';
  } else {
    document.getElementById('feedback').textContent = '❌ 不正解… 正解は「' + q.options[q.answer] + '」でした';
  }
  highlightAnswer(q.answer, idx);
  setTimeout(nextQuestion, 1500);
}

function highlightAnswer(correct, selected) {
  const buttons = document.querySelectorAll('.option');
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === correct) btn.classList.add('correct');
    else if (i === selected) btn.classList.add('wrong');
  });
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('game-area').style.display = 'none';
  const resultArea = document.getElementById('result-area');
  resultArea.style.display = 'block';
  document.getElementById('final-score').textContent = score + ' / ' + questions.length;

  let comment = '';
  const ratio = score / questions.length;
  if (ratio === 1) comment = '完璧！天才です 🏆';
  else if (ratio >= 0.8) comment = 'すばらしい！もう少しで満点 👏';
  else if (ratio >= 0.6) comment = 'なかなかいい感じ！ 😊';
  else if (ratio >= 0.4) comment = 'もう少し頑張ろう 💪';
  else comment = '次は頑張れ…！ 😅';
  document.getElementById('result-comment').textContent = comment;
}

startGame();
</script>
</body>
</html>
